name: CT - Continuous Training & Evaluation Gate

on:
  schedule:
    # Run every Sunday at midnight UTC
    - cron: "0 0 * * 0"
  workflow_dispatch:
    inputs:
      force_promote:
        description: "Force candidate promotion regardless of previous champion"
        required: false
        default: false
        type: boolean

jobs:
  train-and-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Ingest Fresh Data & Train Candidate Model
      run: |
        python src/data_loader.py
        python src/train.py

    - name: Run Champion vs. Challenger Quality Gate
      id: gate
      env:
        FORCE_PROMOTE: ${{ github.event.inputs.force_promote || 'false' }}
      run: |
        set +e
        python src/gate.py
        GATE_EXIT_CODE=$?
        set -e

        if [ $GATE_EXIT_CODE -eq 0 ]; then
          echo "✅ Challenger passed quality gate."
          echo "promoted=true" >> $GITHUB_OUTPUT
        else
          if [ "$FORCE_PROMOTE" = "true" ]; then
            echo "⚠️ Challenger failed gate, but force_promote is enabled. Forcing promotion."
            echo "promoted=true" >> $GITHUB_OUTPUT
          else
            echo "❌ Challenger rejected. Champion retains production status."
            echo "promoted=false" >> $GITHUB_OUTPUT
            exit 0
          fi
        fi

    - name: Generate Fresh Forecast Artifact
      if: steps.gate.outputs.promoted == 'true'
      run: |
        python src/predict.py

    - name: Archive Model Artifacts
      if: steps.gate.outputs.promoted == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: champion-model-artifacts
        path: |
          models/champion/model.joblib
          models/champion/metrics.json
          models/feature_names.json
          data/latest_predictions.json

    - name: Commit & Push Promoted Champion Model
      if: steps.gate.outputs.promoted == 'true'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action [CT Bot]"
        git add models/champion/ models/feature_names.json data/latest_predictions.json
        git diff --staged --quiet || git commit -m "chore(mlops): promote newly verified champion model [skip ci]"
        git push
