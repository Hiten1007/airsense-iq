name: CD - Package & Deploy Service

on:
  push:
    paths:
      - "models/champion/**"
      - "src/**"
      - "templates/**"
      - "Dockerfile"
      - "requirements.txt"
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set lower case repository name
      run: |
        echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ env.REPO_LOWER }}/aqi-predictor
        tags: |
          type=raw,value=latest
          type=sha

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

    - name: Deployment Hook (e.g., Render / Hugging Face Spaces webhook)
      env:
        DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
      run: |
        if [ -n "$DEPLOY_HOOK_URL" ]; then
          echo "Triggering cloud deployment webhook..."
          curl -X POST "$DEPLOY_HOOK_URL"
        else
          echo "DEPLOY_HOOK_URL secret not configured. Skipping deployment webhook trigger."
        fi
